[project]
name = "ssz-spectroscopy-bridge"
version = "0.1.0"
description = "Certified spectral modes + inverse inference + real detector data for SSZ"
requires-python = ">=3.11"
license = {text = "Anticapitalist Software License"}
authors = [{name = "Bingsi", email = "bingsi@error.wtf"}]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "sympy",
]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
